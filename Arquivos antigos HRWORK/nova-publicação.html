<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="publicação.css">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=send" />

    <title>Tela de Publicação</title>
</head>

<body>
    <header class="container">
        <div class="form-box">
            <div class="header">
                <h3>PUBLICAÇÃO</h3>
            </div>
            <div class="seta">
                <a href="tela-canal-de-comunicação.html">
                <svg fill="#ffffff" version="1.1" baseProfile="tiny" id="Layer_1" xmlns:x="&amp;ns_extend;"
                    xmlns:i="&amp;ns_ai;" xmlns:graph="&amp;ns_graphs;" xmlns="http://www.w3.org/2000/svg"
                    xmlns:xlink="http://www.w3.org/1999/xlink"
                    xmlns:a="http://ns.adobe.com/AdobeSVGViewerExtensions/3.0/" width="24px" height="24px"
                    viewBox="0 0 42 42" xml:space="preserve">
                    <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                    <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
                    <g id="SVGRepo_iconCarrier">
                        <polygon fill-rule="evenodd" points="31,38.32 13.391,21 31,3.68 28.279,1 8,21.01 28.279,41 ">
                        </polygon>
                    </g>
                </svg>
                </a>
            </div>
        </div>
        </header>
  <textarea id="mensagem" placeholder="Digite seu recado..."></textarea>

  <button id="publicar">PUBLICAR</button>
</div>


<script type="module">

import { db } from "./firebase.js";

import {
  collection,
  addDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

document
.getElementById("publicar")
.addEventListener("click", async () => {

    const mensagem =
      document.getElementById("mensagem").value;

    if(mensagem.trim() === ""){
        alert("Digite uma mensagem");
        return;
    }

    await addDoc(
      collection(db, "publicacoes"),
      {
        mensagem: mensagem,
        autor: "Gestor",
        data: serverTimestamp()
      }
    );

    window.location.href = "tela-canal-de-comunicação.html";
});

</script>

<script type="module" src="marcador.js"></script>

</body>
</html>
