<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desempenho</title>
    <link rel="stylesheet" href="desempenho.css">
</head>
<body>
    <header class="container">
        <div class="form-box">
            <div class="header">
                <h3>DESEMPENHO</h3>
            </div>
            <div class="seta">
                <a href="relatório.html">
                <svg fill="#ffffff" version="1.1" baseProfile="tiny" id="Layer_1" xmlns:x="&amp;ns_extend;"
                    xmlns:i="&amp;ns_ai;" xmlns:graph="&amp;ns_graphs;" xmlns="http://www.w3.org/2000/svg"
                    xmlns:xlink="http://www.w3.org/1999/xlink"
                    xmlns:a="http://ns.adobe.com/AdobeSVGViewerExtensions/3.0/" width="24px" height="24px"
                    viewBox="0 0 42 42" xml:space="preserve">
                    <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                    <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
                    <g id="SVGRepo_iconCarrier">
                        <polygon fill-rule="evenodd" points="31,38.32 13.391,21 31,3.68 28.279,1 8,21.01 28.279,41 ">
                        </polygon>
                    </g>
                </svg>
                </a>
            </div>
    </header>
<div class="card">
<table>
  <thead>
    <tr>
      <th>Dia</th>
      <th>Entrada</th>
      <th>Saída</th>
      <th>Horas Extras</th>
    </tr>
  </thead>
  <tbody id="tabela-desempenho"></tbody>
</table>
</div>

    <div class="botao">
        <input type="button" value="Imprimir">
    </div>

<script>
function calcularHorasExtras(entrada, saida) {
  if (!entrada || !saida) return "00:00";

  const e = new Date(`1970-01-01T${entrada}`);
  const s = new Date(`1970-01-01T${saida}`);

  const horas = (s - e) / (1000 * 60 * 60);
  const carga = 8;

  if (horas > carga) {
    return "+ " + (horas - carga).toFixed(2);
  }

  return "00:00";
}

document.addEventListener("DOMContentLoaded", () => {
  const tabela = document.getElementById("tabela-desempenho");
  const registros = JSON.parse(localStorage.getItem("registros")) || [];

  registros.forEach(reg => {
    const tr = document.createElement("tr");

    const extra = calcularHorasExtras(reg.entrada, reg.saida);

    tr.innerHTML = `
      <td>${reg.dia}</td>
      <td>${reg.entrada || "--"}</td>
      <td>${reg.saida || "--"}</td>
      <td>${extra}</td>
    `;

    tabela.appendChild(tr);
  });
});
</script>

</body>
</html>
