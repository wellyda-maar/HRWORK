<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Funcionário</title>

    <link rel="stylesheet" href="cadastro.css">
</head>

<body>
<div class="container">

    <h2>Cadastrar Funcionário</h2>

    <input type="text"
           id="nome"
           placeholder="Nome completo">

    <input type="email"
           id="email"
           placeholder="Email">

    <input type="password"
           id="senha"
           placeholder="Senha">

    <input type="text"
           id="cargo"
           placeholder="Cargo">

    <input type="text"
           id="empresa"
           placeholder="Código da empresa">

    <input type="tel"
           id="telefone"
           placeholder="Telefone">

    <input type="text"
           id="departamento"
           placeholder="Departamento">

    <input type="text"
           id="matricula"
           placeholder="Matrícula">


    <button id="cadastrar">
        Cadastrar
    </button>

</div>

<script type="module" src="cadastro.js"></script>

</body>
</html>
