<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de relatório</title>
    <link rel="stylesheet" href="reunião.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=send" />

</head>

<body>
  <header class="container">
    <div class="form-box"></div>
      <div class="header">
        <h3>REUNIÃO</h3>
     
          <div class="seta">
            <a href="marcador-ponto.html">
              <svg fill="#ffffff" version="1.1" baseProfile="tiny" id="Layer_1" xmlns:x="&amp;ns_extend;"
                  xmlns:i="&amp;ns_ai;" xmlns:graph="&amp;ns_graphs;" xmlns="http://www.w3.org/2000/svg"
                  xmlns:xlink="http://www.w3.org/1999/xlink"
                  xmlns:a="http://ns.adobe.com/AdobeSVGViewerExtensions/3.0/" width="24px" height="24px"
                  viewBox="0 0 42 42" xml:space="preserve">
                  <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                  <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
                  <g id="SVGRepo_iconCarrier">
                    <polygon fill-rule="evenodd" points="31,38.32 13.391,21 31,3.68 28.279,1 8,21.01 28.279,41 ">
                    </polygon>
                  </g>
              </svg>
            </a>
          </div>
      </div>
  </header>
    
    <input type="text" id="pesquisa" placeholder="Pesquisar pessoa..." class="input-pesquisa">
    <div id="lista"></div>

    
    <button onclick="iniciarReuniao()">INICIAR REUNIÃO</button>


<script>
const pessoas = [
  { nome: "João", funcao: "Gerente" },
  { nome: "Maria", funcao: "Atendente" },
  { nome: "Carlos", funcao: "Supervisor" },
  { nome: "Ana", funcao: "RH" }
];

const lista = document.getElementById("lista");
const pesquisa = document.getElementById("pesquisa");

// função para mostrar lista
function mostrarLista(filtro = "") {
  lista.innerHTML = "";

  pessoas
    .filter(p => 
      p.nome.toLowerCase().includes(filtro.toLowerCase())
    )
    .forEach(pessoa => {
      const card = document.createElement("div");
      card.className = "card";

      card.innerHTML = `
        <div class="usuario">
          <img src="https://cdn-icons-png.flaticon.com/512/847/847969.png" width="50">
          <div>
            <p><strong>NOME:</strong> ${pessoa.nome}</p>
            <p><strong>FUNÇÃO:</strong> ${pessoa.funcao}</p>
          </div>
        </div>
      `;

      lista.appendChild(card);
    });
}

// busca em tempo real
pesquisa.addEventListener("input", () => {
  mostrarLista(pesquisa.value);
});

// mostra tudo ao iniciar
mostrarLista();
</script>

<script>
function iniciarReuniao(){
    window.open("https://meet.google.com/new");
}
</script>

</body>
</html>
